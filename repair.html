<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dræm. refresh</title>
  <style>
    :root{color-scheme:dark;--bg:#070403;--card:#15100c;--gold:#d5ad5b;--line:#5b3c28;--text:#f5ead8;--muted:#9d8774}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#2a1c13 0,#070403 58%);color:var(--text);font-family:Georgia,"Times New Roman",serif;padding:24px}
    main{width:min(440px,100%);border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    h1{margin:0 0 10px;font-size:32px;color:var(--gold);letter-spacing:.02em}
    p{margin:10px 0;color:var(--muted);line-height:1.7;font-size:15px}
    button{width:100%;min-height:52px;margin-top:18px;border-radius:16px;border:1px solid var(--gold);background:var(--gold);color:#211509;font-weight:700;font-size:16px}
    .log{margin-top:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#bca98d;white-space:pre-wrap}
  </style>
</head>
<body>
  <main>
    <h1>dræm.</h1>
    <p>スマホに残った古いキャッシュだけを更新しています。タスクや記録のデータは消しません。</p>
    <p>数秒で最新のダッシュボードへ戻ります。</p>
    <button id="retry" type="button">手動で最新を開く</button>
    <div class="log" id="log">preparing...</div>
  </main>
  <script>
    const fallback='./?v=ec18eb9';
    const params=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):'');
    const target=params.get('go')||fallback;
    const log=(msg)=>{document.getElementById('log').textContent=msg};
    async function repair(){
      try{
        log('clearing app cache...');
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        log('opening latest dashboard...');
      }catch(e){
        log('cache clear skipped; opening latest dashboard...');
      }
      location.replace(target);
    }
    document.getElementById('retry').addEventListener('click',repair);
    repair();
  </script>
</body>
</html>
